name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/telegram-bot:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/telegram-bot:latest

  deploy:
    needs: build
    runs-on: tl-havtel-runner
    env:
      DEPLOY_DIR: /opt/telegram-bot
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/telegram-bot
      IMAGE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure deploy directory
        run: |
          if [ ! -d "$DEPLOY_DIR" ]; then
            mkdir -p "$DEPLOY_DIR"
          fi

      - name: Copy compose.yaml
        run: cp -f compose.yaml "$DEPLOY_DIR/compose.yaml"

      - name: Pull and restart
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull
          docker compose up -d

  notify-deployed:
    needs: [build, deploy]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          TEXT="🤖 telegram-bot <code>${TAG}</code> desplegado"
          ARGS=(--data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"
                --data-urlencode "parse_mode=HTML"
                --data-urlencode "text=${TEXT}")
          if [ -n "${TELEGRAM_THREAD_ID}" ]; then
            ARGS+=(--data-urlencode "message_thread_id=${TELEGRAM_THREAD_ID}")
          fi
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            "${ARGS[@]}"

  notify-build-failed:
    needs: build
    if: ${{ needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="🤖 telegram-bot build <code>${TAG}</code> falló
          ${RUN_URL}"
          ARGS=(--data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"
                --data-urlencode "parse_mode=HTML"
                --data-urlencode "disable_web_page_preview=true"
                --data-urlencode "text=${TEXT}")
          if [ -n "${TELEGRAM_THREAD_ID}" ]; then
            ARGS+=(--data-urlencode "message_thread_id=${TELEGRAM_THREAD_ID}")
          fi
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            "${ARGS[@]}"

  notify-deploy-failed:
    needs: [build, deploy]
    if: ${{ needs.build.result == 'success' && needs.deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TAG: ${{ needs.build.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="🤖 telegram-bot deploy <code>${TAG}</code> falló
          ${RUN_URL}"
          ARGS=(--data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"
                --data-urlencode "parse_mode=HTML"
                --data-urlencode "disable_web_page_preview=true"
                --data-urlencode "text=${TEXT}")
          if [ -n "${TELEGRAM_THREAD_ID}" ]; then
            ARGS+=(--data-urlencode "message_thread_id=${TELEGRAM_THREAD_ID}")
          fi
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            "${ARGS[@]}"
